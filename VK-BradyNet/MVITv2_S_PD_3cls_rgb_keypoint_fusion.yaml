# MVITv2_S_PD_3cls_rgb_keypoint_fusion.yaml
# RGB + Keypoint feature-level fusion model.
# CSV format required:
#   video_path keypoint_npy_path label
# Example:
#   C:/Users/Administrator/Desktop/data/train/0/10_1.mp4 C:/Users/Administrator/Desktop/data_keypoints_npy/train/0/10_1.npy 0

TRAIN:
  ENABLE: True
  DATASET: kinetics
  BATCH_SIZE: 2
  EVAL_PERIOD: 1
  CHECKPOINT_PERIOD: 5
  AUTO_RESUME: False
  CHECKPOINT_EPOCH_RESET: True
  CHECKPOINT_INFLATE: False
  CHECKPOINT_IN_INIT: False
  CHECKPOINT_TYPE: pytorch
  MIXED_PRECISION: True
  CHECKPOINT_FILE_PATH: "C:/Users/Administrator/Desktop/SlowFast_PD_10D_speed_gated_optimized/SlowFast-main/checkpoints/MViTv2_S_16x4_k400.pyth"

DATA:
  PATH_TO_DATA_DIR: "C:/Users/Administrator/Desktop/data/data"
  USE_OFFSET_SAMPLING: True
  DECODING_BACKEND: pyav
  NUM_FRAMES: 16
  SAMPLING_RATE: 2
  TRAIN_CROP_SIZE: 224
  TEST_CROP_SIZE: 224
  TRAIN_JITTER_SCALES: [224, 256]
  INPUT_CHANNEL_NUM: [3]
  PATH_LABEL_SEPARATOR: " "
  PATH_PREFIX: ""
  RANDOM_FLIP: False
  TRAIN_JITTER_SCALES_RELATIVE: [0.9, 1.0]
  TRAIN_JITTER_ASPECT_RELATIVE: [0.95, 1.05]

FUSION:
  ENABLE: True
  KEYPOINT_ROOT: "C:/Users/Administrator/Desktop/data/data"
  KEYPOINT_NUM_FRAMES: 16
  NUM_KEYPOINTS: 21
  KEYPOINT_DIM: 10
  ENCODER: "transformer"   # "transformer" or "bilstm"
  EMBED_DIM: 128
  NUM_LAYERS: 2
  NUM_HEADS: 4
  DROPOUT: 0.3
  FUSION_DROPOUT: 0.6
  FREEZE_RGB: False
  MISSING_KEYPOINT: "zeros"
  SPEED_ATTENTION: True
  SPEED_ATTENTION_ALPHA: 10.0
  GATED_FUSION: True
  KEYPOINT_FUSION_SCALE: 1.0   # "zeros" or "error"

MVIT:
  ZERO_DECAY_POS_CLS: False
  USE_ABS_POS: False
  REL_POS_SPATIAL: True
  REL_POS_TEMPORAL: True
  DEPTH: 16
  NUM_HEADS: 1
  EMBED_DIM: 96
  PATCH_KERNEL: [3, 7, 7]
  PATCH_STRIDE: [2, 4, 4]
  PATCH_PADDING: [1, 3, 3]
  MLP_RATIO: 4.0
  QKV_BIAS: True
  DROPPATH_RATE: 0.3
  NORM: "layernorm"
  MODE: "conv"
  CLS_EMBED_ON: True
  DIM_MUL: [[1, 2.0], [3, 2.0], [14, 2.0]]
  HEAD_MUL: [[1, 2.0], [3, 2.0], [14, 2.0]]
  POOL_KVQ_KERNEL: [3, 3, 3]
  POOL_KV_STRIDE_ADAPTIVE: [1, 8, 8]
  POOL_Q_STRIDE: [[0, 1, 1, 1], [1, 1, 2, 2], [2, 1, 1, 1], [3, 1, 2, 2], [4, 1, 1, 1], [5, 1, 1, 1], [6, 1, 1, 1], [7, 1, 1, 1], [8, 1, 1, 1], [9, 1, 1, 1], [10, 1, 1, 1], [11, 1, 1, 1], [12, 1, 1, 1], [13, 1, 1, 1], [14, 1, 2, 2], [15, 1, 1, 1]]
  DROPOUT_RATE: 0.0
  DIM_MUL_IN_ATT: True
  RESIDUAL_POOLING: True

AUG:
  ENABLE: True
  NUM_SAMPLE: 1
  COLOR_JITTER: 0.1
  AA_TYPE: ""
  INTERPOLATION: bicubic
  RE_PROB: 0.0
  RE_MODE: pixel
  RE_COUNT: 1
  RE_SPLIT: False

MIXUP:
  ENABLE: False

SOLVER:
  ZERO_WD_1D_PARAM: True
  BASE_LR_SCALE_NUM_SHARDS: False
  CLIP_GRAD_L2NORM: 1.0
  BASE_LR: 0.000003
  COSINE_AFTER_WARMUP: True
  COSINE_END_LR: 0.0000003
  WARMUP_START_LR: 0.0000003
  WARMUP_EPOCHS: 3.0
  LR_POLICY: cosine
  MAX_EPOCH: 30
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.1
  OPTIMIZING_METHOD: adamw

MODEL:
  NUM_CLASSES: 3
  ARCH: mvit
  MODEL_NAME: MViTFusion
  LOSS_FUNC: cross_entropy
  DROPOUT_RATE: 0.7

TEST:
  ENABLE: False
  DATASET: kinetics
  BATCH_SIZE: 2
  NUM_SPATIAL_CROPS: 1
  NUM_ENSEMBLE_VIEWS: 1

DATA_LOADER:
  NUM_WORKERS: 0
  PIN_MEMORY: True

DETECTION:
  ENABLE: False
TENSORBOARD:
  ENABLE: False
DEMO:
  ENABLE: False

NUM_GPUS: 1
NUM_SHARDS: 1
RNG_SEED: 0
OUTPUT_DIR: "./outputs/PD_MVITv2_S_Simple_Fusion"
