# MViTv2-S fine-tuning config for Parkinson motor grading (3 classes: 0/1/2)
# Put this file under: SlowFast-main/pd_mvitv2_s_repro_pack/MVITv2_S_PD_3cls.yaml
# Data CSV format required by SlowFast kinetics loader:
#   train.csv / val.csv / test.csv under DATA.PATH_TO_DATA_DIR
#   each line: relative/or/absolute/path/to/video.mp4 label

TRAIN:
  ENABLE: True
  DATASET: kinetics
  BATCH_SIZE: 4
  EVAL_PERIOD: 5
  CHECKPOINT_PERIOD: 5
  AUTO_RESUME: True
  CHECKPOINT_EPOCH_RESET: True
  MIXED_PRECISION: True
  CHECKPOINT_FILE_PATH: ""

DATA:
  PATH_TO_DATA_DIR: r"C:/Users/Administrator/Desktop/data/"
  USE_OFFSET_SAMPLING: True
  DECODING_BACKEND: torchvision
  NUM_FRAMES: 16
  SAMPLING_RATE: 3
  TRAIN_JITTER_SCALES: [256, 320]
  TRAIN_CROP_SIZE: 224
  TEST_CROP_SIZE: 224
  INPUT_CHANNEL_NUM: [3]
  PATH_LABEL_SEPARATOR: " "
  PATH_PREFIX: ""
  RANDOM_FLIP: False
  TRAIN_JITTER_SCALES_RELATIVE: [0.75, 1.0]
  TRAIN_JITTER_ASPECT_RELATIVE: [0.85, 1.176]

MVIT:
  ZERO_DECAY_POS_CLS: False
  USE_ABS_POS: False
  REL_POS_SPATIAL: True
  REL_POS_TEMPORAL: True
  DEPTH: 16
  NUM_HEADS: 1
  EMBED_DIM: 96
  PATCH_KERNEL: [3, 7, 7]
  PATCH_STRIDE: [2, 4, 4]
  PATCH_PADDING: [1, 3, 3]
  MLP_RATIO: 4.0
  QKV_BIAS: True
  DROPPATH_RATE: 0.2
  NORM: "layernorm"
  MODE: "conv"
  CLS_EMBED_ON: True
  DIM_MUL: [[1, 2.0], [3, 2.0], [14, 2.0]]
  HEAD_MUL: [[1, 2.0], [3, 2.0], [14, 2.0]]
  POOL_KVQ_KERNEL: [3, 3, 3]
  POOL_KV_STRIDE_ADAPTIVE: [1, 8, 8]
  POOL_Q_STRIDE: [[0, 1, 1, 1], [1, 1, 2, 2], [2, 1, 1, 1], [3, 1, 2, 2], [4, 1, 1, 1], [5, 1, 1, 1], [6, 1, 1, 1], [7, 1, 1, 1], [8, 1, 1, 1], [9, 1, 1, 1], [10, 1, 1, 1], [11, 1, 1, 1], [12, 1, 1, 1], [13, 1, 1, 1], [14, 1, 2, 2], [15, 1, 1, 1]]
  DROPOUT_RATE: 0.0
  DIM_MUL_IN_ATT: True
  RESIDUAL_POOLING: True

AUG:
  ENABLE: True
  NUM_SAMPLE: 1
  COLOR_JITTER: 0.2
  AA_TYPE: ""
  INTERPOLATION: bicubic
  RE_PROB: 0.0
  RE_MODE: pixel
  RE_COUNT: 1
  RE_SPLIT: False

MIXUP:
  ENABLE: False

SOLVER:
  ZERO_WD_1D_PARAM: True
  BASE_LR_SCALE_NUM_SHARDS: False
  CLIP_GRAD_L2NORM: 1.0
  BASE_LR: 0.00005
  COSINE_AFTER_WARMUP: True
  COSINE_END_LR: 0.000001
  WARMUP_START_LR: 0.000001
  WARMUP_EPOCHS: 5.0
  LR_POLICY: cosine
  MAX_EPOCH: 60
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.05
  OPTIMIZING_METHOD: adamw

MODEL:
  NUM_CLASSES: 3
  ARCH: mvit
  MODEL_NAME: MViT
  LOSS_FUNC: cross_entropy
  DROPOUT_RATE: 0.5

TEST:
  ENABLE: True
  DATASET: kinetics
  BATCH_SIZE: 8
  NUM_SPATIAL_CROPS: 1
  NUM_ENSEMBLE_VIEWS: 3

DATA_LOADER:
  NUM_WORKERS: 0
  PIN_MEMORY: True

DETECTION:
  ENABLE: False

TENSORBOARD:
  ENABLE: False

DEMO:
  ENABLE: False

NUM_GPUS: 1
NUM_SHARDS: 1
RNG_SEED: 0
OUTPUT_DIR: "./outputs/PD_MVITv2_S_3cls"